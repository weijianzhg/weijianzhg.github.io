name: Update Feed Cache

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Fetch and cache external feeds 📥
        run: |
          mkdir -p _cache

          # Fetch Substack feed with retry logic and validation
          FEED_URL="https://notesfromzero.substack.com/feed"
          TEMP_FILE="_cache/substack.com_feed.xml.tmp"
          CACHE_FILE="_cache/substack.com_feed.xml"

          echo "Fetching feed from Substack..."

          # Try to fetch the feed (with retries)
          for i in {1..3}; do
            if curl -f -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
                    --connect-timeout 10 \
                    --max-time 30 \
                    -o "$TEMP_FILE" \
                    "$FEED_URL"; then

              # Check if it's valid XML (contains <rss or <feed)
              if grep -q -E '<(rss|feed)' "$TEMP_FILE"; then
                mv "$TEMP_FILE" "$CACHE_FILE"
                echo "✅ Feed fetched and cached successfully"
                exit 0
              else
                echo "⚠️ Response is not valid XML, attempt $i/3"
              fi
            else
              echo "⚠️ Fetch failed, attempt $i/3"
            fi
            sleep 5
          done

          # If we get here, all retries failed
          if [ -f "$CACHE_FILE" ]; then
            echo "⚠️ Failed to fetch new feed, but old cache exists - keeping it"
            exit 0
          else
            echo "❌ Failed to fetch feed and no cache exists"
            exit 1
          fi

      - name: Commit and push if changed 💾
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _cache/

          if git diff --staged --quiet; then
            echo "No changes to commit (feed unchanged)"
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit -m "chore: update external feed cache - $TIMESTAMP [skip ci]"
            git push
            echo "✅ Cache updated and pushed to repo"
          fi

