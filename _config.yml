# Site settings
title: Weijian Zhang
author: Weijian Zhang
description: >
  Weijian Zhang builds reliable AI systems for finance: local models, training data, and financial infrastructure with AI built in.
lang: en
url: https://weijian.ai
baseurl: ""
google_site_verification: kp4P4tJw65b8X5XCYGJE0i_FTq13wO6HlEv8-CAtQpg

# Writing archive. Posts come from these feeds; see _plugins/external-posts.rb and _cache/.
permalink: /writing/:year/:title/
external_sources:
  - name: notesfromzero.substack.com
    title: Notes from Zero
    rss_url: https://notesfromzero.substack.com/feed
  - name: latticeworkofmodels.substack.com
    title: Latticework of Models
    rss_url: https://latticeworkofmodels.substack.com/feed

pagination:
  enabled: true

jekyll-archives:
  enabled: [year]
  layouts:
    year: archive-year
  permalinks:
    year: "/writing/:year/"

# Build
include: ["_pages"]
exclude:
  - bin
  - CLAUDE.md
  - node_modules
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - package.json
  - package-lock.json
  - README.md
  - vendor
keep_files:
  - CNAME
  - .nojekyll
defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false

plugins:
  - jekyll-archives
  - jekyll-feed
  - jekyll-paginate-v2
  - jekyll-sitemap
