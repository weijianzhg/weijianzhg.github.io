<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>Weijian Zhang — eval loop mark</title>
  <rect width="512" height="512" rx="112" fill="#0A0A0A"/>
  <!-- open feedback loop -->
  <path d="M256 132
           A124 124 0 1 1 168 168"
        fill="none" stroke="#FFFFFF" stroke-width="40"
        stroke-linecap="round"/>
  <!-- arrowhead closing the loop -->
  <path d="M256 132 L210 120 M256 132 L236 176"
        fill="none" stroke="#FFFFFF" stroke-width="40"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- signal node -->
  <circle cx="256" cy="256" r="40" fill="#FFFFFF"/>
</svg>
